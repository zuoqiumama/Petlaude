<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body { padding: 6px; }

:root {
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --card-bg: #ffffff;
  --card-border: rgba(28, 25, 23, 0.08);
  --card-shadow: 0 4px 16px rgba(28, 25, 23, 0.10), 0 1px 3px rgba(28, 25, 23, 0.06);
  --text-main: #1c1917;
  --text-muted: #78716c;
  --path-bg: #fafaf8;
  --path-border: rgba(28, 25, 23, 0.06);
  --primary-bg: #d97757;
  --primary-hover-bg: #c76648;
  --secondary-bg: #ffffff;
  --secondary-border: #d6d3d1;
  --secondary-hover-bg: #fafaf8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --card-bg: #292524;
    --card-border: rgba(250, 250, 248, 0.10);
    --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.30);
    --text-main: #fafaf8;
    --text-muted: #a8a29e;
    --path-bg: #1c1917;
    --path-border: rgba(250, 250, 248, 0.08);
    --secondary-bg: rgba(250, 250, 248, 0.05);
    --secondary-border: rgba(250, 250, 248, 0.12);
    --secondary-hover-bg: rgba(250, 250, 248, 0.10);
  }
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  box-shadow: var(--card-shadow);
  color: var(--text-main);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  opacity: 0;
  transform: translateY(12px) scale(0.98);
  transition: opacity 0.24s var(--ease-spring), transform 0.28s var(--ease-spring);
  overflow: hidden;
}
.card.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.card.hiding {
  opacity: 0;
  transform: translateY(12px) scale(0.98);
}
.title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
}
.message {
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-muted);
}
.detail {
  max-height: 92px;
  overflow: hidden;
  padding: 9px 10px;
  background: var(--path-bg);
  border: 1px solid var(--path-border);
  border-radius: 8px;
  font-family: "SF Mono", "ui-monospace", "Cascadia Code", monospace;
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-muted);
}
.actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
  gap: 7px;
}
.btn {
  min-width: 0;
  min-height: 30px;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-primary {
  background: var(--primary-bg);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--primary-hover-bg); }
.btn-secondary {
  background: var(--secondary-bg);
  color: var(--text-main);
  border-color: var(--secondary-border);
}
.btn-secondary:hover:not(:disabled) { background: var(--secondary-hover-bg); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="title" id="title"></div>
  <div class="message" id="message"></div>
  <div class="detail" id="detail"></div>
  <div class="actions" id="actions"></div>
</div>
<script>
const card = document.getElementById("card");
const titleEl = document.getElementById("title");
const messageEl = document.getElementById("message");
const detailEl = document.getElementById("detail");
const actionsEl = document.getElementById("actions");

function reportHeight() {
  requestAnimationFrame(() => {
    window.fileDropBubbleAPI.reportHeight(card.offsetHeight + 16);
  });
}

function disableButtons() {
  for (const btn of actionsEl.querySelectorAll("button")) btn.disabled = true;
}

function show(payload) {
  titleEl.textContent = payload.title || "";
  messageEl.textContent = payload.message || "";
  detailEl.textContent = payload.detail || "";
  detailEl.style.display = payload.detail ? "block" : "none";

  actionsEl.innerHTML = "";
  for (const action of payload.actions || []) {
    const btn = document.createElement("button");
    btn.className = `btn btn-${action.variant || "secondary"}`;
    btn.textContent = action.label || action.id;
    btn.title = action.label || action.id;
    btn.addEventListener("click", () => {
      disableButtons();
      window.fileDropBubbleAPI.choose(action.id);
    });
    actionsEl.appendChild(btn);
  }

  card.classList.remove("hiding");
  card.classList.add("visible");
  reportHeight();
}

function hide() {
  card.classList.remove("visible");
  card.classList.add("hiding");
}

window.fileDropBubbleAPI.onShow(show);
window.fileDropBubbleAPI.onHide(hide);
</script>
</body>
</html>
