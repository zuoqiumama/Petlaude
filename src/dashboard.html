<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:">
<title>Dashboard</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #f2f1ec;
  --surface: #ffffff;
  --surface-alt: #eeede8;
  --surface-soft: rgba(28, 25, 23, 0.04);
  --text: #1c1917;
  --muted: #78716c;
  --subtle: #a8a29e;
  --border: rgba(28, 25, 23, 0.09);
  --row-border: rgba(28, 25, 23, 0.07);
  --accent: #78716c;
  --accent-hover: #57534e;
  --accent-vivid: #d4945c;
  --running: #16a34a;
  --done: #a8a29e;
  --interrupted: #d97706;
  --idle: #a8a29e;
  --scroll-thumb: rgba(28, 25, 23, 0.12);
  --scroll-thumb-hover: rgba(28, 25, 23, 0.24);
  --line-session: #d4945c;
  --line-active: #6b7fff;
  --line-session-rgb: 212, 148, 92;
  --line-active-rgb: 107, 127, 255;
  --card-shadow: 0 1px 3px rgba(28, 25, 23, 0.08);
  --card-shadow-hover: 0 8px 30px rgba(28, 25, 23, 0.10);
  --win-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 8px 40px rgba(0,0,0,0.12);
  --win-radius: 10px;
  --radius-sm: 8px;
  --radius: 16px;
  --radius-lg: 20px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171412;
    --surface: #2d2927;
    --surface-alt: #3d3835;
    --surface-soft: rgba(250, 250, 248, 0.04);
    --text: #fafaf8;
    --muted: #a8a29e;
    --subtle: #78716c;
    --border: rgba(250, 250, 248, 0.10);
    --row-border: rgba(250, 250, 248, 0.07);
    --running: #34d399;
    --done: #78716c;
    --interrupted: #fbbf24;
    --idle: #78716c;
    --scroll-thumb: rgba(250, 250, 248, 0.12);
    --scroll-thumb-hover: rgba(250, 250, 248, 0.24);
    --line-session: #f0a060;
    --line-active: #8095ff;
    --line-session-rgb: 240, 160, 96;
    --line-active-rgb: 128, 149, 255;
    --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    --card-shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.45);
    --win-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 8px 40px rgba(0,0,0,0.50);
  }
}

html, body {
  height: 100%;
  margin: 0;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow: hidden;
}

.window-frame {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  border-radius: var(--win-radius);
  overflow: hidden;
  box-shadow: var(--win-shadow);
  transition: border-radius 0.2s ease, box-shadow 0.2s ease;
}
.window-frame.maximized {
  border-radius: 0;
  box-shadow: none;
}

/* ── Title bar ── */
.title-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 14px;
  -webkit-app-region: drag;
  user-select: none;
  position: relative;
  z-index: 10;
}
.title-bar-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  pointer-events: none;
  white-space: nowrap;
}
.traffic-lights {
  display: flex;
  align-items: center;
  gap: 8px;
  -webkit-app-region: no-drag;
  flex-shrink: 0;
  margin-left: auto;
}
.traffic-light {
  width: 12px;
  height: 12px;
  min-width: 12px;
  min-height: 12px;
  flex: 0 0 12px;
  border-radius: 50%;
  border: none;
  padding: 0;
  cursor: pointer;
  position: relative;
  transition: filter 0.15s ease;
  background: none;
  box-shadow: none;
}
.traffic-light::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.15s ease;
}
.traffic-lights:hover .traffic-light::after {
  opacity: 1;
}
.traffic-light.close { background: #ff5f57; }
.traffic-light.close::after { background: radial-gradient(circle, rgba(0,0,0,0.42) 30%, transparent 34%); }
.traffic-light.minimize { background: #febc2e; }
.traffic-light.minimize::after { background: radial-gradient(circle, rgba(0,0,0,0.42) 30%, transparent 34%); }
.traffic-light.maximize { background: #28c840; }
.traffic-light.maximize::after { background: radial-gradient(circle, rgba(0,0,0,0.42) 30%, transparent 34%); }
.traffic-light:active { filter: brightness(0.82); }

.app {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.header {
  flex: 0 0 auto;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  background: transparent;
}

.title-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}

h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: 0;
}

.count {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.content {
  flex: 1 1 auto;
  overflow-y: auto;
  min-height: 0;
  padding: 20px 24px 24px;
}
/* Wrapper hosts let the quota / usage / sessions subtrees re-render
   independently; display:contents keeps the visual layout identical to a
   flat child list. */
.section-host { display: contents; }

.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

/* ── Bento Grid Usage Section ── */
.usage-section {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 0 0 24px;
}

.usage-header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}

.usage-title,
.usage-panel-title {
  margin: 0;
  color: var(--text);
  font-size: 14px;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: 0;
}

.usage-range {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(120, 113, 108, 0.12);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
}

.usage-period-tabs {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 8px;
  background: rgba(120, 113, 108, 0.12);
  -webkit-app-region: no-drag;
}

.usage-period-button {
  min-width: 0;
  width: auto;
  height: 24px;
  padding: 0 9px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  box-shadow: none;
}

.usage-period-button:hover:not(:disabled) {
  background: rgba(120, 113, 108, 0.14);
  color: var(--text);
  transform: none;
  box-shadow: none;
}

.usage-period-button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(28, 25, 23, 0.08);
}

.usage-summary {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.usage-metric,
.usage-panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
  transition: transform 0.25s ease-out, box-shadow 0.25s ease-out, border-color 0.25s ease-out;
  position: relative;
  overflow: hidden;
}

.usage-metric::before,
.usage-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.25s ease;
  background: linear-gradient(135deg, rgba(28, 25, 23, 0.03), transparent);
  pointer-events: none;
}

.usage-metric:hover,
.usage-panel:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
  border-color: rgba(28, 25, 23, 0.14);
}

.usage-metric:hover::before,
.usage-panel:hover::before { opacity: 1; }

.usage-metric:active,
.usage-panel:active { transform: scale(0.985); }

.usage-metric {
  min-width: 0;
  padding: 18px 20px;
}

.usage-metric:first-child {
  background: linear-gradient(135deg, rgba(120, 113, 108, 0.06), transparent 60%), var(--surface);
}

.usage-label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.usage-value {
  display: block;
  margin-top: 6px;
  color: var(--text);
  font-size: 28px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.usage-metric:first-child .usage-value {
  font-size: 32px;
  background: linear-gradient(135deg, #78716c, #a8a29e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.usage-subtext {
  display: block;
  margin-top: 8px;
  color: var(--subtle);
  font-size: 11px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.usage-panel {
  grid-column: span 2;
  padding: 18px 20px;
}

.usage-panel.chart-panel,
.usage-panel.heatmap-panel,
.usage-panel.usage-details-panel {
  grid-column: 1 / -1;
}

.usage-panel.chart-panel { padding-bottom: 14px; }

.usage-agent-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 12px;
}

.usage-agent-row {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) minmax(54px, auto) minmax(58px, auto) minmax(58px, auto);
  gap: 10px;
  align-items: center;
  min-height: 26px;
  color: var(--text);
  font-size: 12px;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  transition: background 0.18s ease;
}

.usage-agent-row:hover:not(.usage-agent-head) { background: var(--surface-soft); }

.usage-agent-head {
  min-height: 18px;
  color: var(--subtle);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.usage-swatch,
.legend-swatch {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(28, 25, 23, 0.12);
}

.usage-agent-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 650;
}

.usage-agent-value {
  color: var(--text);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.usage-agent-value.muted { color: var(--muted); }

.usage-empty {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  padding: 8px 6px;
}

.usage-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}

.usage-mini-stat {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--row-border);
  border-radius: var(--radius-sm);
  background: var(--surface-soft);
}

.usage-mini-value {
  display: block;
  margin-top: 5px;
  color: var(--text);
  font-size: 18px;
  line-height: 1.1;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.usage-provider-bar {
  display: flex;
  width: 100%;
  height: 9px;
  margin: 12px 0 14px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-alt);
  box-shadow: inset 0 0 0 1px var(--row-border);
}

.usage-provider-bar > span {
  min-width: 2px;
  height: 100%;
}

.usage-provider-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.usage-provider-card {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--row-border);
  border-radius: var(--radius-sm);
  background: var(--surface-soft);
}

.usage-provider-head {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.usage-provider-name,
.usage-project-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-size: 12px;
  font-weight: 750;
}

.usage-provider-share {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.usage-provider-tokens {
  margin-top: 8px;
  color: var(--text);
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.usage-provider-model {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 11px;
}

.usage-provider-model span:first-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chart-panel { padding-bottom: 10px; }
.usage-chart { margin-top: 10px; }

.usage-chart svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 230px;
}

.chart-axis { stroke: rgba(28, 25, 23, 0.12); stroke-width: 1; }

.chart-grid {
  stroke: rgba(28, 25, 23, 0.05);
  stroke-width: 1;
  stroke-dasharray: 3 4;
  pointer-events: none;
}

.chart-y-label {
  fill: var(--subtle);
  font-size: 10px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.chart-y-label-right {
  fill: var(--muted);
  font-size: 10px;
  font-weight: 500;
}

.chart-day {
  fill: var(--subtle);
  font-size: 10px;
  font-weight: 650;
}

.chart-line {
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.session-line {
  stroke: var(--line-session);
  opacity: 0.88;
  filter: drop-shadow(0 1px 3px rgba(var(--line-session-rgb), 0.25));
}

.active-line {
  stroke: var(--line-active);
  filter: drop-shadow(0 1px 3px rgba(var(--line-active-rgb), 0.25));
}

.cost-line {
  stroke: #10b981;
  color: #10b981;
  opacity: 0.9;
  filter: drop-shadow(0 1px 3px rgba(16, 185, 129, 0.22));
}

.chart-hover-line {
  stroke: var(--muted);
  stroke-width: 1;
  stroke-dasharray: 3 3;
  opacity: 0.5;
  pointer-events: none;
}

.chart-tooltip {
  position: absolute;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
  font-size: 11px;
  line-height: 1.6;
  color: var(--text);
  pointer-events: none;
  white-space: nowrap;
  z-index: 20;
}

.chart-fill-session { fill: rgba(var(--line-session-rgb), 0.08); }
.chart-fill-active { fill: rgba(var(--line-active-rgb), 0.08); }

.usage-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 11px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.legend-line {
  width: 20px;
  height: 0;
  border-top: 2.5px solid currentColor;
  border-radius: 999px;
}

.legend-line.session-line { color: var(--line-session); stroke: none; opacity: 0.7; }
.legend-line.active-line { color: var(--line-active); stroke: none; }
.legend-line.cost-line { color: #10b981; stroke: none; }

.usage-model-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.usage-model-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 42px;
  padding: 6px;
  border-radius: var(--radius-sm);
}

.usage-model-row:hover { background: var(--surface-soft); }

.usage-model-main {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 8px;
  align-items: center;
}

.usage-model-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}

.usage-model-source {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  white-space: nowrap;
}

.usage-model-bar {
  grid-column: 1 / -1;
  display: block;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-alt);
  overflow: hidden;
}

.usage-model-bar > span {
  display: block;
  height: 100%;
  min-width: 2px;
  border-radius: inherit;
}

.usage-model-stats {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  color: var(--text);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.usage-model-stats .muted {
  color: var(--muted);
  font-size: 11px;
}

.usage-project-list,
.usage-context-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.usage-rate-window-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}

.usage-rate-window-row {
  display: grid;
  gap: 6px;
}

.usage-rate-window-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.usage-rate-window-source {
  font-weight: 600;
  font-size: 12px;
}

.usage-rate-window-resets {
  color: var(--muted);
  font-size: 11px;
}

.usage-rate-window-bar > span {
  background: linear-gradient(90deg, #38bdf8, #6b7fff);
}

.usage-rate-window-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
}

.usage-rate-window-stats .muted { color: var(--muted); }

.usage-weekly-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.usage-weekly-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.usage-weekly-status {
  color: var(--muted);
  font-size: 11px;
}

.usage-weekly-button {
  font-size: 11px;
  padding: 4px 10px;
}

.usage-weekly-canvas {
  display: block;
  width: min(360px, 100%);
  margin: 14px auto 4px;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.usage-project-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 6px;
  border-radius: var(--radius-sm);
}

.usage-project-row:hover { background: var(--surface-soft); }

.usage-project-main {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.usage-project-ref {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--subtle);
  font-size: 10px;
}

.usage-cost-table,
.usage-detail-table {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 12px;
}

.usage-cost-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(62px, auto) minmax(58px, auto);
  gap: 10px;
  align-items: center;
  min-height: 30px;
  padding: 5px 6px;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 12px;
}

.usage-detail-row {
  display: grid;
  grid-template-columns: minmax(90px, auto) minmax(0, 1fr) minmax(62px, auto) minmax(58px, auto);
  gap: 10px;
  align-items: center;
  min-height: 30px;
  padding: 5px 6px;
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 12px;
}

.usage-cost-row:hover:not(.usage-cost-head),
.usage-detail-row:hover:not(.usage-cost-head) { background: var(--surface-soft); }

.usage-cost-head {
  min-height: 18px;
  color: var(--subtle);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.usage-cost-name {
  min-width: 0;
  display: grid;
  gap: 2px;
}

.usage-cost-name strong,
.usage-detail-source,
.usage-detail-date {
  min-width: 0;
  overflow: hidden;

.quota-value-row {

.quota-agent-picker {

@media (prefers-color-scheme: dark) {

@media (max-width: 480px) {
  .quota-grid { grid-template-columns: 1fr; }

/* ── Session Groups ── */
.group { margin: 0 0 24px; }

.group-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  padding: 0 4px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ── Session Cards ── */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

.card {
  position: relative;
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  width: 100%;
  min-height: 90px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--card-shadow);
  transition: transform 0.25s ease-out, box-shadow 0.25s ease-out, border-color 0.25s ease-out;
}

.card:hover {
  transform: translateY(-4px) scale(1.005);
  box-shadow: var(--card-shadow-hover);
  border-color: rgba(28, 25, 23, 0.14);
}

.card:active { transform: scale(0.985); }

.session-id-badge {
  position: absolute;
  top: 10px;
  right: 42px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--subtle);
  pointer-events: none;
}

.agent-icon,
.agent-fallback {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  flex: 0 0 auto;
  transition: transform 0.25s ease-out;
}

.card:hover .agent-icon,
.card:hover .agent-fallback { transform: scale(1.1); }

.agent-icon { object-fit: contain; background: var(--surface-alt); }

.agent-fallback {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-alt);
  color: var(--muted);
  font-weight: 700;
  font-size: 12px;
}

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.session-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 2px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--text);
}

.session-title-input {
  width: 100%;
  min-width: 0;
  height: 24px;
  margin: -2px 0 0;
  padding: 2px 8px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  outline: none;
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  font-weight: 700;
  line-height: 1.35;
  user-select: text;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.session-title-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(120, 113, 108, 0.16);
}

.meta, .path, .event-row {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.path { color: var(--subtle); }
.event-row { color: var(--muted); }

.badge { display: inline-flex; align-items: center; gap: 5px; }

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--idle);
}

.badge-running .dot { background: var(--running); }
.badge-done .dot { background: var(--done); }
.badge-interrupted .dot { background: var(--interrupted); }

.actions { display: flex; justify-content: flex-end; gap: 6px; }

.mark-read-button {
  background: var(--surface-alt);
  color: var(--text);
  border-color: var(--border);
}

.mark-read-button:hover:not(:disabled) {
  background: var(--accent);
  color: #ffffff;
  border-color: transparent;
}

/* ── Buttons ── */
button {
  min-width: 82px;
  height: 32px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--accent);
  color: #ffffff;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 0 12px;

}

button:hover:not(:disabled) {

  transform: translateY(-1px);

}

.hide-session-button:hover:not(:disabled) {
  background: var(--surface-alt);

  transform: none;
  box-shadow: none;
}

.hide-session-button:disabled {
  background: transparent;

}

/* ── Empty State ── */
.empty {
  height: 100%;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;

  padding: 24px;
}

.empty-title { color: var(--text); font-weight: 700; font-size: 16px; }

.hidden { display: none !important; }

/* ── Dark mode overrides ── */
@media (prefers-color-scheme: dark) {
  .usage-metric::before,
  .usage-panel::before { background: linear-gradient(135deg, rgba(250, 250, 248, 0.03), transparent); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .usage-section { grid-template-columns: repeat(2, 1fr); }
  .usage-summary { grid-template-columns: 1fr 1fr; }
  .usage-summary .usage-metric:first-child { grid-column: 1 / -1; }
  .usage-panel { grid-column: 1 / -1; }
  .cards { grid-template-columns: 1fr; }

@media (max-width: 480px) {
  .header { padding: 16px 16px 12px; }
  .content { padding: 12px; }
  .usage-section { grid-template-columns: 1fr; gap: 10px; }

  .card { grid-template-columns: 28px minmax(0, 1fr); }
  .actions { grid-column: 2; justify-content: flex-start; }
}
</style>
